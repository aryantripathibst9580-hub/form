<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form in HTML</title>
</head>
<body>

<form>
    <label for="">Name:</label>
    <input type="text" placeholder="enter your name">
    <br><br>
    <label for="">Email:</label>
    <input type="Email"/>
    <br><br>
    <label for="">Phone</label>
    <input type="number"/>
    <br><br>
    <label for="">Passward</label>
    <input type="passward"/>
    <br><br>

    <input type="date"/>
    <br><br>
    <label for="">Time:</label>
    <input type="time"/>
    <br><br>
    <label for="">Range:</label>
    <input type="range"/>
    <br><br>
    <lable for="">Color:</lable>
    <input type="color"/>

    <label for="">Address</label>
    <textarea name=""id=""cols="50"rows="5"></textarea>
    <br/><br/>

    <br/><br/>
    <select name=""id="">
        <option value="bmw">BMW</option>
        <option value="audi">Audi</option>
        <option value="jaguar">Jaguar</option>
    </select>
    <br/><br/>
    <label for="">Select your hobbies</label>
    <br/><br/>
    <label for="travel">Travel</label>
    <input id="travel" type="checkbox"/>

    <input id="games"type="Checkbox"/>

    <input id="read"type="Checkbox"/>

    <br/>
    <br/>

    <br/><br/>
    <label for="male">Male</label>
    <input id="male"type="radio" name="gender"/>
    <label for="female">Female</label>
    <input id="female"type="radio" name="gender"/>
    <label for="other">Other</label>
    <input id="other"type="radio"name="gender"/>
    <br/><br/>
    <label for="other">other</label>
    <input id="other" type="radio" name="gender">
    <br><br>
    <button type="submit"
    style="background-color: blue; color: white;">submit</button>
</form>

    
</body>
</html>
